name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check host scripts
        run: |
          for f in host/*.js host/codemode/*.js host/codemode/worker/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
      - name: Check extension scripts
        run: |
          for f in extension/*.js extension/recorder/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
